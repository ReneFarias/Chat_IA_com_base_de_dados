<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Guia de Relatórios · Assistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F2ED;
    --surface: #FFFFFF;
    --ink: #1F2A24;
    --ink-soft: #5B6A62;
    --border: #E1DED3;
    --brand: #2F6F5E;
    --brand-dark: #234F43;
    --brand-tint: #E7EFEC;
    --amber: #C98A3D;
    --amber-tint: #F7EDDD;
    --radius: 16px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(47,111,94,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: var(--font-body);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app{
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: transparent;
  }

  @media (min-width: 760px){
    .app{
      margin: 24px auto;
      min-height: calc(100vh - 48px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(31,42,36,0.04), 0 12px 32px rgba(31,42,36,0.10);
      border: 1px solid var(--border);
    }
  }

  /* ---------- Header ---------- */
  header{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .mark{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mark svg{ width: 22px; height: 22px; }

  .header-text h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-text p{
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand);
    display: inline-block;
    box-shadow: 0 0 0 3px var(--brand-tint);
  }

  /* ---------- Chat area ---------- */
  main{
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row{
    display: flex;
    gap: 10px;
    max-width: 100%;
  }

  .row.user{ justify-content: flex-end; }

  .avatar{
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--brand-tint);
    color: var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .bubble{
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 78%;
    word-wrap: break-word;
  }

  .row.bot .bubble{
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .row.user .bubble{
    background: var(--brand);
    color: #fff;
    border-top-right-radius: 4px;
  }

  .bubble p{ margin: 0 0 8px; }
  .bubble p:last-child{ margin-bottom: 0; }

  /* Report/link reference chip — the signature element */
  .ref-chip{
    display: flex;
    align-items: flex-start;
    gap: 9px;
    background: var(--amber-tint);
    border: 1px solid #EAD3AC;
    border-radius: 10px;
    padding: 9px 11px;
    margin-top: 8px;
    text-decoration: none;
    color: var(--ink);
  }

  .ref-chip .ref-icon{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--amber);
    border: 1px solid #EAD3AC;
    border-radius: 5px;
    padding: 2px 5px;
    flex-shrink: 0;
    margin-top: 1px;
    letter-spacing: 0.03em;
  }

  .ref-chip .ref-text{
    font-size: 13.5px;
    line-height: 1.45;
    word-break: break-word;
  }

  .bubble a:not(.ref-chip){
    color: var(--brand-dark);
    font-weight: 500;
  }
  .row.user .bubble a{ color: #fff; text-decoration-color: rgba(255,255,255,0.6); }

  /* Typing indicator */
  .typing{
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    opacity: 0.5;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity: 0.4; }
    30%{ transform: translateY(-4px); opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce){
    .typing span{ animation: none; opacity: 0.7; }
  }

  /* ---------- Suggestion chips ---------- */
  .suggestions{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 16px 4px;
  }

  .chip{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .chip:hover{ border-color: var(--brand); }
  .chip:active{ transform: scale(0.97); }

  /* ---------- Input bar ---------- */
  .composer{
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  textarea{
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 14px;
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 120px;
    background: var(--bg);
    color: var(--ink);
  }
  textarea:focus{
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-tint);
  }
  textarea::placeholder{ color: var(--ink-soft); }

  .send-btn{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--brand);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  .send-btn:hover{ background: var(--brand-dark); }
  .send-btn:disabled{ background: var(--ink-soft); cursor: default; opacity: 0.5; }
  .send-btn svg{ width: 18px; height: 18px; }

  .footnote{
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 2px 16px 12px;
  }

  main::-webkit-scrollbar{ width: 6px; }
  main::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5.5C4 4.67 4.67 4 5.5 4H12V20H5.5C4.67 20 4 19.33 4 18.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20 5.5C20 4.67 19.33 4 18.5 4H12V20H18.5C19.33 20 20 19.33 20 18.5V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
        <path d="M8 8H9M8 11H9" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Guia de Relatórios</h1>
      <p><span class="status-dot"></span>Assistente para achar o relatório certo</p>
    </div>
  </header>

  <main id="chat"></main>

  <div class="suggestions" id="suggestions">
    <button class="chip" type="button">Relatório de vendas do mês</button>
    <button class="chip" type="button">Indicadores financeiros</button>
    <button class="chip" type="button">Como encontro um relatório antigo?</button>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Descreva o que você precisa encontrar…" autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" type="submit" aria-label="Enviar mensagem">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="white" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
  <div class="footnote">Assistente de IA · pode cometer erros, confira sempre o relatório original</div>
</div>

<script>
  // =====================================================================
  // CONFIGURAÇÃO — troque pela URL pública do seu webhook do n8n
  // =====================================================================
  const CONFIG = {
    WEBHOOK_URL: "https://SEU-TUNEL-OU-DOMINIO.com/webhook/SEU-WEBHOOK-ID",
  };

  const chat = document.getElementById("chat");
  const composer = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const suggestions = document.getElementById("suggestions");

  const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

  function scrollToBottom(){
    chat.scrollTop = chat.scrollHeight;
  }

  // Converte texto simples em HTML seguro, detectando URLs e linhas
  // "Caminho: ..." / "Local: ..." para virarem o chip de referência.
  function escapeHTML(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderBotText(raw){
    const lines = raw.split(/\n+/).filter(Boolean);
    let html = "";
    const urlRegex = /((https?:\/\/|www\.)[^\s]+)/gi;
    const pathRegex = /^(caminho|local|onde encontrar|pasta)\s*:\s*(.+)$/i;

    lines.forEach(line => {
      const pathMatch = line.match(pathRegex);
      if (pathMatch){
        const label = escapeHTML(pathMatch[1]);
        const value = escapeHTML(pathMatch[2]);
        html += `<div class="ref-chip"><span class="ref-icon">${label.slice(0,3).toUpperCase()}</span><span class="ref-text">${value}</span></div>`;
        return;
      }
      let safe = escapeHTML(line);
      safe = safe.replace(urlRegex, url => {
        const href = url.startsWith("http") ? url : `https://${url}`;
        return `<a href="${href}" target="_blank" rel="noopener">${url}</a>`;
      });
      html += `<p>${safe}</p>`;
    });

    return html || `<p>${escapeHTML(raw)}</p>`;
  }

  function addMessage(role, content, isTyping){
    const row = document.createElement("div");
    row.className = `row ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "bot" ? "◆" : "";
    if (role === "user") avatar.style.display = "none";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (isTyping){
      bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    } else if (role === "bot"){
      bubble.innerHTML = renderBotText(content);
    } else {
      bubble.textContent = content;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  async function sendMessage(text){
    if (!text.trim()) return;

    suggestions.style.display = "none";
    addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    const typingRow = addMessage("bot", "", true);

    try {
      const response = await fetch(CONFIG.WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          from: sessionId,
          channel: "web",
          timestamp: Date.now(),
        }),
      });

      if (!response.ok) throw new Error(`status ${response.status}`);

      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); } catch { data = raw; }

      const replyText =
        typeof data === "string"
          ? data
          : data?.reply || data?.output || data?.text || "Não consegui montar uma resposta agora.";

      typingRow.remove();
      addMessage("bot", replyText);
    } catch (err) {
      typingRow.remove();
      addMessage("bot", "Não consegui falar com o assistente agora. Tente novamente em instantes.");
      console.error("Erro ao chamar o webhook:", err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  composer.addEventListener("submit", e => {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  suggestions.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => sendMessage(chip.textContent));
  });

  // Mensagem inicial de boas-vindas
  addMessage("bot", "Olá! Eu ajudo a encontrar o relatório certo do Power BI. Me conta o que você está procurando — assunto, período ou área — que eu indico onde está.");
</script>
</body>
</html>
